<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Music — Web Player</title>
  <style>
    :root {
      --bg-base: #121214;
      --bg-sidebar: rgba(24, 24, 28, 0.78);
      --bg-panel: rgba(30, 30, 36, 0.65);
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-card-hover: rgba(255, 255, 255, 0.12);
      --accent: #fa243c;
      --accent-hover: #ff3b52;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.62);
      --text-muted: rgba(255, 255, 255, 0.36);
      --border: rgba(255, 255, 255, 0.09);
      --player-height: 84px;
      --sidebar-width: 250px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Dynamic Blurred Background */
    .ambient-bg {
      position: fixed;
      inset: -60px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(80px) saturate(1.6) brightness(0.38);
      transition: background-image 0.9s ease, background-color 0.9s ease;
      pointer-events: none;
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 30% 20%, rgba(250, 36, 60, 0.08), rgba(14, 14, 17, 0.85) 75%);
      pointer-events: none;
    }

    /* Main Workspace Layout */
    .workspace {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      height: calc(100vh - var(--player-height));
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #fa243c, #fb5c74);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(250, 36, 60, 0.4);
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 9px 32px 9px 32px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.13);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(250, 36, 60, 0.22);
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
    }

    .nav-item.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .playlist-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-new-pl {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .import-btn {
      margin-top: auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .import-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Center Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(18, 18, 22, 0.45);
    }

    .topbar {
      height: 58px;
      padding: 0 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .view-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .topbar-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .pill-btn:hover, .pill-btn.active {
      background: rgba(250, 36, 60, 0.18);
      border-color: rgba(250, 36, 60, 0.5);
      color: #fff;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 26px 40px;
    }

    /* Quick Chips */
    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Hero Banner */
    .hero-card {
      background: linear-gradient(135deg, rgba(250, 36, 60, 0.28), rgba(45, 32, 68, 0.55));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .hero-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff6b7d;
      margin-bottom: 6px;
    }

    .hero-card h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .hero-card p {
      font-size: 13.5px;
      color: var(--text-secondary);
      max-width: 520px;
      line-height: 1.45;
    }

    /* Track Table / List */
    .section-heading {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 36px 46px 1fr 1fr 110px 52px;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .track-row:hover {
      background: var(--bg-card-hover);
    }

    .track-row.playing {
      background: rgba(250, 36, 60, 0.16);
    }

    .track-num {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .track-row.playing .track-num {
      color: var(--accent);
      font-weight: 700;
    }

    .track-cover {
      width: 44px;
      height: 44px;
      border-radius: 7px;
      object-fit: cover;
      background: #25252b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .track-meta {
      min-width: 0;
    }

    .track-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-row.playing .track-title {
      color: var(--accent);
    }

    .track-artist {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-album {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-btn.fav-active {
      color: var(--accent);
    }

    .track-duration {
      font-size: 12.5px;
      color: var(--text-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Right Panel: Sing Lyrics & Up Next Queue */
    .right-panel {
      width: 340px;
      background: rgba(20, 20, 25, 0.72);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s ease;
    }

    .right-panel.hidden {
      display: none;
    }

    .panel-tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .tab-group {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px;
      border-radius: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .lyrics-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px 22px 60px;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .lyric-line {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.34);
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: left center;
    }

    .lyric-line:hover {
      color: rgba(255, 255, 255, 0.72);
    }

    .lyric-line.active {
      color: #ffffff;
      transform: scale(1.04);
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
    }

    .lyric-line.past {
      color: rgba(255, 255, 255, 0.48);
    }

    .queue-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    /* Bottom Player Bar */
    .player-bar {
      position: relative;
      z-index: 10;
      height: var(--player-height);
      background: rgba(24, 24, 29, 0.88);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      align-items: center;
      padding: 0 22px;
      gap: 16px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .np-art {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: linear-gradient(135deg, #fa243c, #7b2cbf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .np-info {
      min-width: 0;
    }

    .np-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-artist {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .badge-lossless {
      display: inline-block;
      margin-top: 4px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, transform 0.1s;
    }

    .ctrl-btn:hover {
      color: #fff;
    }

    .ctrl-btn.active {
      color: var(--accent);
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s;
    }

    .play-btn:hover {
      transform: scale(1.06);
    }

    .progress-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.16);
      height: 4px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
      flex: 1;
    }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .volume-slider {
      width: 90px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #1e1e24;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .eq-bands {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 18px 0;
      text-align: center;
    }

    .eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .eq-band input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 6px;
      height: 110px;
    }

    .modal textarea {
      width: 100%;
      height: 190px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      resize: vertical;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .status-box {
      padding: 28px 20px;
      text-align: center;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      line-height: 1.55;
      font-size: 13.5px;
    }

    @media (max-width: 980px) {
      .right-panel {
        position: fixed;
        right: 0;
        top: 0;
        bottom: var(--player-height);
        z-index: 20;
      }
      .track-row {
        grid-template-columns: 28px 42px 1fr 80px 44px;
      }
      .track-album {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg" id="ambientBg"></div>
  <div class="ambient-overlay"></div>

  <div class="workspace">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <span>Music</span>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search songs, artists..." autocomplete="off" />
        <button class="clear-search" id="clearSearchBtn" title="Clear">×</button>
      </div>

      <div class="nav-section">
        <div class="nav-label">Apple Music</div>
        <div class="nav-item active" data-view="listen-now">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span>Listen Now</span>
        </div>
        <div class="nav-item" data-view="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Catalog Search</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Library</div>
        <div class="nav-item" data-view="all-songs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>All Songs</span>
        </div>
        <div class="nav-item" data-view="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span>Favorite Songs</span>
        </div>
      </div>

      <div class="nav-section" style="flex:1; min-height:0;">
        <div class="nav-label">
          <span>Playlists</span>
          <button class="btn-new-pl" id="newPlaylistBtn">+ New</button>
        </div>
        <div class="playlist-list" id="playlistList"></div>
      </div>

      <input type="file" id="fileInput" accept="audio/*,.lrc" multiple hidden />

  <audio id="audioEl" crossorigin="anonymous"></audio>

  <script>
    // Built-in Starter Library (works offline + demo synced lyrics)
    const starterTracks = [
      {
        id: 'local-1',
        title: 'Midnight Reflections',
        artist: 'Kaito & The Dreamers',
        album: 'Tokyo Rain',
        duration: 32,
        artwork: '',
        color: 'linear-gradient(135deg, #6366f1, #ec4899)',
        synthChord: [261.63, 329.63, 392.00, 493.88],
        lrc: `[00:00.50] Neon puddles shimmer on the avenue
[00:04.50] Late night static fading into pastel blue
[00:09.00] Every drop of rain keeps a steady beat
[00:13.50] Walking through the quiet of a sleeping street
[00:18.00] Hold onto the warmth inside a coffee cup
[00:22.50] Watching all the city lights come waking up
[00:27.00] Midnight reflections drifting through the glass`
      },
      {
        id: 'local-2',
        title: 'Seasons (Acoustic Session)',
        artist: 'Wave to Earth',
        album: 'Summer Flows 0.02',
        duration: 30,
        artwork: '',
        color: 'linear-gradient(135deg, #0ea5e9, #10b981)',
        synthChord: [220.00, 261.63, 329.63, 392.00],
        lrc: `[00:00.50] I can't be your love
[00:04.00] Look it's too trivial for you now
[00:08.50] Oh my life is fallin' apart
[00:13.00] Maybe no one will notice if I disappear
[00:18.00] But I'll pray for you all the time
[00:23.00] If I could be by your side
[00:26.50] I'll give you all my life, my seasons`
      },
      {
        id: 'local-3',
        title: 'Apocalypse',
        artist: 'Cigarettes After Sex',
        album: 'Cigarettes After Sex',
        duration: 30,
        artwork: '',
        color: 'linear-gradient(135deg, #334155, #0f172a)',
        synthChord: [196.00, 246.94, 293.66, 369.99],
        lrc: `[00:00.50] You leapt from crumbling bridges watching cityscapes turn to dust
[00:06.00] Filming helicopters crashing in the ocean from way above
[00:12.00] Got the music in you, baby, tell me why
[00:17.50] Got the music in you, baby, tell me why
[00:23.00] You've been locked in here forever and you just can't say goodbye`
      }
    ];

    // App State
    const state = {
      library: [...starterTracks],
      favorites: new Set(['local-1']),
      playlists: [
        { id: 'pl-1', name: 'Late Night Focus', trackIds: ['local-1', 'local-3'] },
        { id: 'pl-2', name: 'Indie & Dream Pop', trackIds: ['local-2', 'local-3'] }
      ],
      queue: [...starterTracks],
      currentIndex: 0,
      currentTrack: null,
      isPlaying: false,
      shuffle: false,
      repeat: false,
      activeView: 'listen-now',
      activePlaylistId: null,
      searchQuery: '',
      searchResults: null, // null = not searched, 'loading', 'error', or Array
      parsedLyrics: [],
      activeLyricIdx: -1
    };

    const audio = document.getElementById('audioEl');
    let synthInterval = null;
    let synthStartTime = 0;
    let synthElapsed = 0;
    let audioCtx = null;
    let eqFilters = [];
    let isSynthMode = false;

    // Initialize Web Audio EQ
    function initAudioContext() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      const freqs = [60, 230, 910, 3600, 14000];
      eqFilters = freqs.map((f, i) => {
        const filter = audioCtx.createBiquadFilter();
        filter.type = i === 0 ? 'lowshelf' : i === freqs.length - 1 ? 'highshelf' : 'peaking';
        filter.frequency.value = f;
        filter.gain.value = 0;
        return filter;
      });

      try {
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(eqFilters[0]);
        for (let i = 0; i < eqFilters.length - 1; i++) {
          eqFilters[i].connect(eqFilters[i + 1]);
        }
        eqFilters[eqFilters.length - 1].connect(audioCtx.destination);
      } catch (e) {
        console.warn('MediaElementSource fallback:', e);
      }
    }

    // Built-in ambient synth for demo tracks without external MP3s
    function startDemoSynth(track) {
      stopDemoSynth();
      initAudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isSynthMode = true;
      synthStartTime = performance.now() - synthElapsed * 1000;

      const playPulse = () => {
        if (!state.isPlaying || !isSynthMode) return;
        const notes = track.synthChord || [261.63, 329.63, 392.00];
        const freq = notes[Math.floor(Math.random() * notes.length)];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.06 * parseFloat(document.getElementById('volumeBar').value), audioCtx.currentTime + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
        osc.connect(gain);
        gain.connect(eqFilters[0] || audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.45);
      };

      playPulse();
      synthInterval = setInterval(playPulse, 950);
    }

    function stopDemoSynth() {
      if (synthInterval) {
        clearInterval(synthInterval);
        synthInterval = null;
      }
    }

    // Parse LRC or Plain Lyrics
    function parseLyrics(text) {
      if (!text || !text.trim()) {
        return [{ time: 0, text: 'No lyrics available for this track. Click the edit icon above to add .LRC lyrics.' }];
      }
      const lines = text.split('\n');
      const result = [];
      const timeRegex = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;

      lines.forEach(line => {
        const matches = [...line.matchAll(timeRegex)];
        const cleanText = line.replace(timeRegex, '').trim();
        if (!cleanText) return;
        if (matches.length > 0) {
          matches.forEach(m => {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
            result.push({ time: min * 60 + sec + ms / 1000, text: cleanText });
          });
        } else {
          result.push({ time: null, text: cleanText });
        }
      });

      // Auto-assign timestamps if plain text
      if (result.every(r => r.time === null)) {
        const dur = (state.currentTrack && state.currentTrack.duration) || 30;
        const step = dur / Math.max(result.length, 1);
        result.forEach((r, idx) => { r.time = idx * step; });
      } else {
        result.sort((a, b) => a.time - b.time);
      }
      return result;
    }

    // Fetch Synced Lyrics from LRCLIB
    async function fetchSyncedLyricsOnline(track) {
      try {
        const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(track.title)}&artist_name=${encodeURIComponent(track.artist)}`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        const lrc = data.syncedLyrics || data.plainLyrics;
        if (lrc && state.currentTrack && state.currentTrack.id === track.id) {
          track.lrc = lrc;
          state.parsedLyrics = parseLyrics(lrc);
          renderLyrics();
        }
      } catch (e) {
        // Ignore if blocked in sandbox
      }
    }

    // Play Track
    function playTrack(track, queueList = null) {
      if (queueList) state.queue = [...queueList];
      const idx = state.queue.findIndex(t => t.id === track.id);
      state.currentIndex = idx >= 0 ? idx : 0;
      state.currentTrack = track;
      state.activeLyricIdx = -1;
      synthElapsed = 0;

      // Update UI
      document.getElementById('npTitle').textContent = track.title;
      document.getElementById('npArtist').textContent = track.artist;
      document.getElementById('npBadge').textContent = track.audioUrl ? 'APPLE MUSIC PREVIEW • LRCLIB' : 'LOCAL / SYNTH • SYNCED LYRICS';

      const npArt = document.getElementById('npArt');
      const ambientBg = document.getElementById('ambientBg');
      if (track.artwork) {
        npArt.innerHTML = `<img src="${track.artwork}" style="width:100%;height:100%;border-radius:8px;object-fit:cover;">`;
        ambientBg.style.backgroundImage = `url('${track.artwork}')`;
      } else {
        npArt.innerHTML = '🎵';
        npArt.style.background = track.color || 'linear-gradient(135deg, #fa243c, #7b2cbf)';
        ambientBg.style.backgroundImage = 'none';
        ambientBg.style.backgroundColor = '#2a1624';
      }

      updateFavButton();
      state.parsedLyrics = parseLyrics(track.lrc);
      renderLyrics();
      renderQueue();
      renderMainView();

      if (!track.lrc && track.title && track.artist) {
        fetchSyncedLyricsOnline(track);
      }

      // Audio Playback
      stopDemoSynth();
      audio.pause();

      if (track.audioUrl) {
        isSynthMode = false;
        audio.src = track.audioUrl;
        audio.volume = parseFloat(document.getElementById('volumeBar').value);
        audio.play().then(() => {
          state.isPlaying = true;
          updatePlayIcon();
        }).catch(err => {
          console.warn('Playback blocked or failed:', err);
          state.isPlaying = false;
          updatePlayIcon();
        });
      } else {
        state.isPlaying = true;
        updatePlayIcon();
        startDemoSynth(track);
      }
    }

    function togglePlayPause() {
      if (!state.currentTrack) {
        playTrack(state.library[0], state.library);
        return;
      }
      if (state.isPlaying) {
        state.isPlaying = false;
        if (isSynthMode) {
          synthElapsed = (performance.now() - synthStartTime) / 1000;
          stopDemoSynth();
        } else {
          audio.pause();
        }
      } else {
        state.isPlaying = true;
        if (isSynthMode) {
          startDemoSynth(state.currentTrack);
        } else {
          audio.play();
        }
      }
      updatePlayIcon();
    }

    function updatePlayIcon() {
      const icon = document.getElementById('playIcon');
      icon.innerHTML = state.isPlaying
        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    function playNext() {
      if (!state.queue.length) return;
      let nextIdx = state.shuffle
        ? Math.floor(Math.random() * state.queue.length)
        : (state.currentIndex + 1) % state.queue.length;
      playTrack(state.queue[nextIdx]);
    }

    function playPrev() {
      if (!state.queue.length) return;
      let prevIdx = (state.currentIndex - 1 + state.queue.length) % state.queue.length;
      playTrack(state.queue[prevIdx]);
    }

    // Live Catalog Search via iTunes Search API
    let searchDebounce = null;
    async function performCatalogSearch(query) {
      const q = query.trim();
      state.searchQuery = q;
      document.getElementById('clearSearchBtn').style.display = q ? 'flex' : 'none';

      if (!q) {
        state.searchResults = null;
        renderMainView();
        return;
      }

      state.activeView = 'search';
      updateSidebarActive();
      state.searchResults = 'loading';
      renderMainView();

      try {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=25`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();

        state.searchResults = (data.results || []).map(item => ({
          id: `itunes-${item.trackId}`,
          title: item.trackName,
          artist: item.artistName,
          album: item.collectionName || 'Single',
          duration: Math.round((item.trackTimeMillis || 30000) / 1000),
          artwork: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x600bb') : '',
          audioUrl: item.previewUrl,
          lrc: ''
        }));
      } catch (err) {
        console.warn('Search request failed:', err);
        state.searchResults = 'error';
      }

      renderMainView();
    }

    // Render Track Rows
    function createTrackRowHTML(track, index, listContext) {
      const isPlaying = state.currentTrack && state.currentTrack.id === track.id;
      const isFav = state.favorites.has(track.id);
      const inLib = state.library.some(t => t.id === track.id);
      const artHTML = track.artwork
        ? `<img class="track-cover" src="${track.artwork}" alt="" loading="lazy" />`
        : `<div class="track-cover" style="background:${track.color || '#2b2b33'}">🎵</div>`;

      return `
        <div class="track-row ${isPlaying ? 'playing' : ''}" data-track-id="${track.id}">
          <div class="track-num">${isPlaying && state.isPlaying ? 'ılıl' : index + 1}</div>
          ${artHTML}
          <div class="track-meta">
            <div class="track-title">${escapeHtml(track.title)}</div>
            <div class="track-artist">${escapeHtml(track.artist)}</div>
          </div>
          <div class="track-album">${escapeHtml(track.album)}</div>
          <div class="track-actions" onclick="event.stopPropagation()">
            ${!inLib ? `<button class="pill-btn" style="padding:3px 8px;font-size:11px;" onclick="addToLibrary('${track.id}')">+ Library</button>` : ''}
            <button class="icon-btn ${isFav ? 'fav-active' : ''}" onclick="toggleFavorite('${track.id}')" title="Favorite">♥</button>
            <button class="icon-btn" onclick="addToQueue('${track.id}')" title="Play Next">⤴</button>
          </div>
          <div class="track-duration">${formatTime(track.duration)}</div>
        </div>
      `;
    }

    // Render Center View
    function renderMainView() {
      const container = document.getElementById('mainScroll');
      const titleEl = document.getElementById('viewTitle');

      if (state.activeView === 'search') {
        titleEl.textContent = state.searchQuery ? `Search: "${state.searchQuery}"` : 'Catalog Search';
        const chips = ['The Cure', 'Wave to Earth', 'Cigarettes After Sex', 'Joji', 'Taylor Swift', 'Khin Maung Toe'];
        let html = `
          <div class="chips-row">
            ${chips.map(c => `<button class="chip" onclick="triggerQuickSearch('${c}')">${c}</button>`).join('')}
          </div>
        `;

        if (!state.searchQuery) {
          html += `<div class="status-box">Type any song or artist in the search box on the left, or click a suggestion chip above.</div>`;
        } else if (state.searchResults === 'loading') {
          html += `<div class="status-box">Searching Apple Music / iTunes catalog for "<strong>${escapeHtml(state.searchQuery)}</strong>"...</div>`;
        } else if (state.searchResults === 'error') {
          const localMatches = state.library.filter(t =>
            t.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
            t.artist.toLowerCase().includes(state.searchQuery.toLowerCase())
          );
          html += `
            <div class="status-box" style="margin-bottom:18px;">
              <strong>Online catalog blocked in this preview iframe.</strong><br>
              Open this <code>index.html</code> file directly in Safari/Chrome or host on Netlify/GitHub Pages for live global search.
            </div>
          `;
          if (localMatches.length) {
            html += `<div class="section-heading">Local Library Matches</div><div class="track-list" id="renderedTrackList">
              ${localMatches.map((t, i) => createTrackRowHTML(t, i)).join('')}
            </div>`;
          }
        } else if (Array.isArray(state.searchResults)) {
          if (state.searchResults.length === 0) {
            html += `<div class="status-box">No results found for "${escapeHtml(state.searchQuery)}".</div>`;
          } else {
            html += `<div class="section-heading">Top Results (${state.searchResults.length})</div>
              <div class="track-list" id="renderedTrackList">
                ${state.searchResults.map((t, i) => createTrackRowHTML(t, i)).join('')}
              </div>`;
          }
        }

        container.innerHTML = html;
        bindTrackRowClicks(Array.isArray(state.searchResults) ? state.searchResults : state.library);
        return;
      }

      if (state.activeView === 'listen-now') {
        titleEl.textContent = 'Listen Now';
        container.innerHTML = `
          <div class="hero-card">
            <div>
              <div class="hero-tag">Apple Music Sing • Lossless UI</div>
              <h2>Time-Synced Lyrics & Live Catalog Search</h2>
              <p>Search millions of tracks, play previews with automatic LRCLIB synced lyrics, or import your own local MP3/M4A files and .LRC lyric sheets.</p>
            </div>
            <button class="btn-primary" onclick="playTrack(state.library[0], state.library)">▶ Play Featured</button>
          </div>
          <div class="section-heading">Featured & Library Tracks</div>
          <div class="track-list" id="renderedTrackList">
            ${state.library.map((t, i) => createTrackRowHTML(t, i)).join('')}
          </div>
        `;
        bindTrackRowClicks(state.library);
        return;
      }

      if (state.activeView === 'all-songs') {
        titleEl.textContent = `All Songs (${state.library.length})`;
        container.innerHTML = `
          <div class="track-list" id="renderedTrackList">
            ${state.library.map((t, i) => createTrackRowHTML(t, i)).join('')}
          </div>
        `;
        bindTrackRowClicks(state.library);
        return;
      }

      if (state.activeView === 'favorites') {
        const favTracks = state.library.filter(t => state.favorites.has(t.id));
        titleEl.textContent = `Favorite Songs (${favTracks.length})`;
        container.innerHTML = favTracks.length
          ? `<div class="track-list" id="renderedTrackList">${favTracks.map((t, i) => createTrackRowHTML(t, i)).join('')}</div>`
          : `<div class="status-box">No favorite songs yet. Click ♥ on any song to add it here.</div>`;
        bindTrackRowClicks(favTracks);
        return;
      }

      if (state.activeView === 'playlist') {
        const pl = state.playlists.find(p => p.id === state.activePlaylistId);
        const tracks = pl ? pl.trackIds.map(id => state.library.find(t => t.id === id)).filter(Boolean) : [];
        titleEl.textContent = pl ? pl.name : 'Playlist';
        container.innerHTML = tracks.length
          ? `<div class="track-list" id="renderedTrackList">${tracks.map((t, i) => createTrackRowHTML(t, i)).join('')}</div>`
          : `<div class="status-box">This playlist is empty.</div>`;
        bindTrackRowClicks(tracks);
      }
    }

    function bindTrackRowClicks(trackSource) {
      document.querySelectorAll('#renderedTrackList .track-row').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.getAttribute('data-track-id');
          const track = trackSource.find(t => t.id === id) || state.library.find(t => t.id === id);
          if (track) playTrack(track, trackSource);
        });
      });
    }

    function triggerQuickSearch(term) {
      const input = document.getElementById('searchInput');
      input.value = term;
      performCatalogSearch(term);
    }

    function findTrackAnywhere(id) {
      return state.library.find(t => t.id === id) ||
        (Array.isArray(state.searchResults) ? state.searchResults.find(t => t.id === id) : null);
    }

    function addToLibrary(id) {
      const track = findTrackAnywhere(id);
      if (track && !state.library.some(t => t.id === id)) {
        state.library.unshift(track);
        renderMainView();
      }
    }

    function toggleFavorite(id) {
      addToLibrary(id);
      if (state.favorites.has(id)) state.favorites.delete(id);
      else state.favorites.add(id);
      updateFavButton();
      renderMainView();
    }

    function updateFavButton() {
      const btn = document.getElementById('npFavBtn');
      if (state.currentTrack && state.favorites.has(state.currentTrack.id)) {
        btn.classList.add('fav-active');
      } else {
        btn.classList.remove('fav-active');
      }
    }

    function addToQueue(id) {
      const track = findTrackAnywhere(id);
      if (track) {
        state.queue.splice(state.currentIndex + 1, 0, track);
        renderQueue();
      }
    }

    // Lyrics Rendering & Sync
    function renderLyrics() {
      const box = document.getElementById('lyricsContainer');
      if (!state.parsedLyrics.length) {
        box.innerHTML = `<div class="lyric-line active">Select a song to view synced lyrics.</div>`;
        return;
      }
      box.innerHTML = state.parsedLyrics.map((line, i) => `
        <div class="lyric-line ${i === state.activeLyricIdx ? 'active' : ''}" data-idx="${i}" data-time="${line.time}">
          ${escapeHtml(line.text)}
        </div>
      `).join('');

      box.querySelectorAll('.lyric-line').forEach(el => {
        el.addEventListener('click', () => {
          const t = parseFloat(el.getAttribute('data-time'));
          if (!isNaN(t)) seekTo(t);
        });
      });
    }

    function syncLyricsToTime(currentSec) {
      if (!state.parsedLyrics.length) return;
      let newIdx = -1;
      for (let i = 0; i < state.parsedLyrics.length; i++) {
        if (currentSec >= state.parsedLyrics[i].time) newIdx = i;
        else break;
      }
      if (newIdx !== state.activeLyricIdx) {
        state.activeLyricIdx = newIdx;
        const lines = document.querySelectorAll('#lyricsContainer .lyric-line');
        lines.forEach((el, idx) => {
          el.classList.toggle('active', idx === newIdx);
          el.classList.toggle('past', idx < newIdx);
        });
        if (newIdx >= 0 && lines[newIdx]) {
          lines[newIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    function renderQueue() {
      const qBox = document.getElementById('queueContainer');
      qBox.innerHTML = state.queue.map((t, i) => `
        <div class="track-row ${state.currentTrack && state.currentTrack.id === t.id ? 'playing' : ''}" style="grid-template-columns: 24px 36px 1fr 40px;" onclick="playTrack(state.queue[${i}])">
          <div class="track-num">${i + 1}</div>
          <div class="track-cover" style="width:34px;height:34px;background:${t.color || '#2b2b33'}">${t.artwork ? `<img src="${t.artwork}" style="width:100%;height:100%;border-radius:6px;object-fit:cover;">` : '🎵'}</div>
          <div class="track-meta">
            <div class="track-title" style="font-size:13px;">${escapeHtml(t.title)}</div>
            <div class="track-artist" style="font-size:11.5px;">${escapeHtml(t.artist)}</div>
          </div>
          <div class="track-duration">${formatTime(t.duration)}</div>
        </div>
      `).join('');
    }

    function seekTo(seconds) {
      if (!state.currentTrack) return;
      if (isSynthMode) {
        synthElapsed = seconds;
        synthStartTime = performance.now() - seconds * 1000;
      } else if (audio.duration) {
        audio.currentTime = Math.min(seconds, audio.duration);
      }
      syncLyricsToTime(seconds);
    }

    // Progress Loop
    setInterval(() => {
      if (!state.currentTrack) return;
      let cur = 0;
      let dur = state.currentTrack.duration || 30;

      if (isSynthMode) {
        cur = state.isPlaying ? (performance.now() - synthStartTime) / 1000 : synthElapsed;
        if (cur >= dur) {
          if (state.repeat) {
            seekTo(0);
          } else {
            playNext();
          }
          return;
        }
      } else {
        cur = audio.currentTime || 0;
        dur = audio.duration || dur;
      }

      document.getElementById('currentTime').textContent = formatTime(cur);
      document.getElementById('totalTime').textContent = formatTime(dur);
      const seekBar = document.getElementById('seekBar');
      seekBar.max = dur;
      seekBar.value = cur;
      syncLyricsToTime(cur);
    }, 120);

    audio.addEventListener('ended', () => {
      if (state.repeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        playNext();
      }
    });

    // Playlists Sidebar
    function renderPlaylists() {
      const list = document.getElementById('playlistList');
      list.innerHTML = state.playlists.map(pl => `
        <div class="nav-item ${state.activeView === 'playlist' && state.activePlaylistId === pl.id ? 'active' : ''}" onclick="openPlaylist('${pl.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>${escapeHtml(pl.name)}</span>
        </div>
      `).join('');
    }

    function openPlaylist(id) {
      state.activeView = 'playlist';
      state.activePlaylistId = id;
      updateSidebarActive();
      renderMainView();
    }

    function updateSidebarActive() {
      document.querySelectorAll('.sidebar .nav-item[data-view]').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-view') === state.activeView);
      });
      renderPlaylists();
    }

    // Equalizer Setup
    function buildEqUI() {
      const labels = ['60Hz', '230Hz', '910Hz', '3.6kHz', '14kHz'];
      document.getElementById('eqBands').innerHTML = labels.map((lbl, i) => `
        <div class="eq-band">
          <span id="eqVal${i}">0 dB</span>
          <input type="range" min="-12" max="12" step="1" value="0" oninput="setEqBand(${i}, this.value)" />
          <span>${lbl}</span>
        </div>
      `).join('');
    }

    function setEqBand(idx, val) {
      initAudioContext();
      if (eqFilters[idx]) eqFilters[idx].gain.value = parseFloat(val);
      document.getElementById(`eqVal${idx}`).textContent = `${val > 0 ? '+' : ''}${val} dB`;
      document.getElementById('eqOpenBtn').textContent = 'EQ: Custom';
    }

    function applyEqPreset(name, gains) {
      initAudioContext();
      const sliders = document.querySelectorAll('#eqBands input[type="range"]');
      gains.forEach((g, i) => {
        if (sliders[i]) sliders[i].value = g;
        if (eqFilters[i]) eqFilters[i].gain.value = g;
        document.getElementById(`eqVal${i}`).textContent = `${g > 0 ? '+' : ''}${g} dB`;
      });
      document.getElementById('eqOpenBtn').textContent = `EQ: ${name}`;
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // Local Audio + LRC File Import
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const files = [...e.target.files];
      const audioFiles = files.filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac)$/i.test(f.name));
      const lrcFiles = files.filter(f => f.name.toLowerCase().endsWith('.lrc'));

      for (const file of audioFiles) {
        const baseName = file.name.replace(/\.[^/.]+$/, '');
        const matchingLrc = lrcFiles.find(l => l.name.replace(/\.[^/.]+$/, '').toLowerCase() === baseName.toLowerCase());
        const lrcText = matchingLrc ? await matchingLrc.text() : '';
        const url = URL.createObjectURL(file);

        const newTrack = {
          id: `file-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          title: baseName,
          artist: 'Local File',
          album: 'Imported Audio',
          duration: 180,
          artwork: '',
          color: 'linear-gradient(135deg, #f59e0b, #ef4444)',
          audioUrl: url,
          lrc: lrcText
        };
        state.library.unshift(newTrack);
      }

      state.activeView = 'all-songs';
      updateSidebarActive();
      renderMainView();
    });

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => performCatalogSearch(e.target.value), 350);
    });

    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      const inp = document.getElementById('searchInput');
      inp.value = '';
      performCatalogSearch('');
    });

    document.querySelectorAll('.sidebar .nav-item[data-view]').forEach(item => {
      item.addEventListener('click', () => {
        state.activeView = item.getAttribute('data-view');
        updateSidebarActive();
        renderMainView();
      });
    });

    document.getElementById('newPlaylistBtn').addEventListener('click', () => {
      const name = prompt('New Playlist Name:');
      if (name && name.trim()) {
        const id = `pl-${Date.now()}`;
        state.playlists.push({ id, name: name.trim(), trackIds: state.currentTrack ? [state.currentTrack.id] : [] });
        openPlaylist(id);
      }
    });

    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    document.getElementById('prevBtn').addEventListener('click', playPrev);

    document.getElementById('shuffleBtn').addEventListener('click', (e) => {
      state.shuffle = !state.shuffle;
      e.currentTarget.classList.toggle('active', state.shuffle);
    });

    document.getElementById('repeatBtn').addEventListener('click', (e) => {
      state.repeat = !state.repeat;
      e.currentTarget.classList.toggle('active', state.repeat);
    });

    document.getElementById('seekBar').addEventListener('input', (e) => {
      seekTo(parseFloat(e.target.value));
    });

    document.getElementById('volumeBar').addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    document.getElementById('npFavBtn').addEventListener('click', () => {
      if (state.currentTrack) toggleFavorite(state.currentTrack.id);
    });

    // Right Panel Tabs
    const rightPanel = document.getElementById('rightPanel');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const queueContainer = document.getElementById('queueContainer');

    document.getElementById('tabLyrics').addEventListener('click', (e) => {
      e.target.classList.add('active');
      document.getElementById('tabQueue').classList.remove('active');
      lyricsContainer.style.display = 'flex';
      queueContainer.style.display = 'none';
    });

    document.getElementById('tabQueue').addEventListener('click', (e) => {
      e.target.classList.add('active');
      document.getElementById('tabLyrics').classList.remove('active');
      lyricsContainer.style.display = 'none';
      queueContainer.style.display = 'flex';
    });

    document.getElementById('toggleLyricsBtn').addEventListener('click', () => {
      rightPanel.classList.remove('hidden');
      document.getElementById('tabLyrics').click();
    });

    document.getElementById('toggleQueueBtn').addEventListener('click', () => {
      rightPanel.classList.remove('hidden');
      document.getElementById('tabQueue').click();
    });

    document.getElementById('eqOpenBtn').addEventListener('click', () => {
      document.getElementById('eqModal').classList.add('open');
    });

    document.getElementById('editLyricsBtn').addEventListener('click', () => {
      if (!state.currentTrack) return;
      document.getElementById('lyricsTextarea').value = state.currentTrack.lrc || '';
      document.getElementById('lyricsModal').classList.add('open');
    });

    document.getElementById('saveLyricsBtn').addEventListener('click', () => {
      if (!state.currentTrack) return;
      state.currentTrack.lrc = document.getElementById('lyricsTextarea').value;
      state.parsedLyrics = parseLyrics(state.currentTrack.lrc);
      renderLyrics();
      closeModal('lyricsModal');
    });

    // Helpers
    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Boot
    buildEqUI();
    renderPlaylists();
    renderMainView();
    renderQueue();
    state.parsedLyrics = parseLyrics(starterTracks[0].lrc);
    renderLyrics();
  </script>
</body>
</html>
